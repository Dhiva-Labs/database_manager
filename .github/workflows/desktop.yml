name: Desktop builds

# Linux and Windows, x64 and arm64, built natively on a runner of each
# architecture. Every leg runs the tests, checks the machine type of every
# binary in the bundle, packages it and starts the packaged app once. The
# Linux .deb is then repackaged as .rpm (Fedora, RHEL, openSUSE), Arch
# package, AppImage and Flatpak, and an AUR PKGBUILD, each installed and run
# on its distribution.
# A published release gets the packages attached; names that are already on
# the release (hand-uploaded files) are left alone.

on:
  push:
    branches: [main, linux-distros]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the packages to (leave empty to only build)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # liblmdb0: the LMDB driver loads it at runtime and its tests need it.
      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the installed .deb.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            liblmdb0 \
            file xvfb xauth xdotool dbus-x11

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      # Runs the SQLite and SQLCipher tests against the libsqlcipher that the
      # sqlite3 build hook fetches for this architecture. The MySQL, PostgreSQL
      # and MongoDB tests skip themselves because no server is running.
      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in database_manager lib/libapp.so lib/libflutter_linux_gtk.so lib/libsqlcipher.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 4 ] && [ "$bad" -eq 0 ]

      - name: Package .deb
        run: |
          OUT_DIR=dist packaging/make_deb.sh

      - name: Check the .deb
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          DEB="dist/database-manager_${VERSION}_${{ matrix.deb_arch }}.deb"
          ls -l dist
          [ "$(ls dist | wc -l)" -eq 1 ]
          dpkg-deb --info "$DEB"
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "${{ matrix.deb_arch }}" ]
          sudo apt-get install -y "./$DEB"
          for f in database_manager lib/libsqlcipher.so lib/libapp.so; do
            file "/usr/lib/database-manager/$f" | tee /dev/stderr | grep "$ELF_MACHINE"
          done

      # Starts the installed package with a clean data directory. The window is
      # only shown after Flutter renders its first frame, and the connection
      # list creates the application-support directory from Dart.
      - name: Smoke-run the installed app (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          export XDG_DATA_HOME="$RUNNER_TEMP/smoke-data"
          rm -rf "$XDG_DATA_HOME"
          mkdir -p "$XDG_DATA_HOME"
          log="$RUNNER_TEMP/smoke.log"
          database-manager > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --name 'Database Manager' > /dev/null 2>&1 \
               && [ -n "$(ls -A "$XDG_DATA_HOME")" ]; then
              echo "Database Manager is up after ${i}s: window shown, data directory:"
              ls -A "$XDG_DATA_HOME"
              sleep 5
              kill -0 "$pid" || { echo "database-manager died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "database-manager exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "database-manager did not come up in 90s"
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            vcpkg_triplet: x64-windows
            pe_machine: '0x8664'
            elf_machine: '0x3E'
          - arch: arm64
            runner: windows-11-arm
            vcpkg_triplet: arm64-windows
            pe_machine: '0xAA64'
            elf_machine: '0xB7'
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE_DIR: build\windows\${{ matrix.arch }}\runner\Release
      # PE COFF machine of every .exe/.dll, and ELF e_machine of the AOT
      # snapshot (data\app.so is an ELF file on Windows too).
      PE_MACHINE: ${{ matrix.pe_machine }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # On an ARM64 host (PROCESSOR_ARCHITECTURE=ARM64) the bootstrap fetches
      # the arm64 Dart SDK and `flutter build windows` targets windows-arm64.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"

      - name: Configure Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          flutter config --no-analytics --enable-windows-desktop
          flutter precache --windows
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      # The LMDB driver loads lmdb.dll from the system (the app does not ship
      # it), and its tests need one for this architecture.
      - name: Install LMDB for the tests
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "lmdb:${{ matrix.vcpkg_triplet }}"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }
          $bin = "$env:VCPKG_INSTALLATION_ROOT\installed\${{ matrix.vcpkg_triplet }}\bin"
          Get-ChildItem $bin
          Add-Content -Path $env:GITHUB_ENV -Value "LMDB_BIN=$bin"

      # Runs the SQLite and SQLCipher tests against the sqlcipher.dll that the
      # sqlite3 build hook fetches for this architecture. The MySQL, PostgreSQL
      # and MongoDB tests skip themselves because no server is running.
      - name: Test
        run: |
          $env:PATH = "$env:LMDB_BIN;$env:PATH"
          flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Assert every PE file is ${{ matrix.pe_machine }}
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $files = Get-ChildItem -Path $env:RELEASE_DIR -Recurse -File -Include *.exe, *.dll
          foreach ($required in 'database_manager.exe', 'flutter_windows.dll', 'sqlcipher.dll') {
            if (-not ($files.Name -contains $required)) { throw "$required missing from $env:RELEASE_DIR" }
          }
          $bad = 0
          foreach ($f in $files) {
            $m = Get-PeMachine $f.FullName
            '{0,-50} 0x{1:X4}' -f $f.Name, $m
            if ($m -ne $expected) { Write-Host "::error file=$($f.FullName)::machine 0x$('{0:X4}' -f $m), expected $env:PE_MACHINE"; $bad++ }
          }
          $bytes = [IO.File]::ReadAllBytes("$env:RELEASE_DIR\data\app.so")
          $elf = [BitConverter]::ToUInt16($bytes, 0x12)
          'data\app.so ELF e_machine 0x{0:X2}' -f $elf
          if ($elf -ne [Convert]::ToUInt16($env:ELF_MACHINE, 16)) { Write-Host "::error::app.so is not $env:ELF_MACHINE"; $bad++ }
          "checked $($files.Count) PE files and app.so"
          if ($bad) { exit 1 }

      - name: Package zip
        run: ./packaging/package_windows.ps1 -OutDir dist

      - name: Check the zip
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          Get-ChildItem dist | Format-Table Name, Length
          $zips = @(Get-ChildItem dist)
          if ($zips.Count -ne 1) { throw 'expected exactly one zip in dist' }
          $zipName = $zips[0].BaseName
          if ($zipName -notlike "DatabaseManager-*-windows-$env:ARCH") { throw "unexpected zip name $zipName" }
          $zip = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            foreach ($dll in 'database_manager.exe', 'sqlcipher.dll') {
              $entry = $zip.GetEntry("$zipName/$dll")
              if (-not $entry) { throw "$zipName/$dll not in the zip" }
              $tmp = Join-Path $env:RUNNER_TEMP "zip_$dll"
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp, $true)
              $m = Get-PeMachine $tmp
              'zip: {0} entries, {1} 0x{2:X4}' -f $zip.Entries.Count, $dll, $m
              if ($m -ne $expected) { throw "zip holds the wrong architecture for $dll" }
            }
          } finally { $zip.Dispose() }

      # Unpacks the zip and starts it with a window, like a user would. The
      # window is only shown after Flutter renders its first frame, and the
      # connection list creates %APPDATA%\com.dhivalabs\database_manager from
      # Dart.
      - name: Smoke-run the packaged app
        timeout-minutes: 5
        run: |
          $dataDir = Join-Path $env:APPDATA 'com.dhivalabs\database_manager'
          if (Test-Path $dataDir) { Remove-Item -Recurse -Force $dataDir }
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath $unpacked
          $exe = (Get-ChildItem -Path $unpacked -Recurse -Filter database_manager.exe).FullName
          $p = Start-Process -FilePath $exe -PassThru
          $up = $false
          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { throw "database_manager.exe exited early with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0 -and (Test-Path $dataDir)) {
              "window '$($p.MainWindowTitle)' is up after ${i}s; data folder $dataDir exists"
              $up = $true
              break
            }
          }
          if (-not $up) {
            Stop-Process -Id $p.Id -Force
            throw "database_manager.exe did not come up in 90 s (window handle $($p.MainWindowHandle), data folder exists: $(Test-Path $dataDir))"
          }
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "database_manager.exe died after showing its window (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm),
  # Arch (.pkg.tar.zst) and any glibc distribution (AppImage), then installs
  # every one of them on the real distribution and runs it there: ldd of
  # every ELF file, the app under Xvfb until its window is up and Dart has
  # created the data folder, and the liblmdb the LMDB driver loads.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: deb

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The AppImage and the Flatpak carry liblmdb.so.0 from this machine
      # (BUNDLE_LIBS in distro.conf): the package the .deb recommends.
      - name: Install the library to bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y liblmdb0

      # One installed tree, the .deb's, for every format. The Flatpak job
      # gets the same cleaned tree (tar keeps modes and symlinks).
      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          dpkg-deb -x "deb/database-manager_${VERSION}_${{ matrix.deb_arch }}.deb" "$RUNNER_TEMP/root"
          VERSION="$VERSION" TREE_TARBALL="$RUNNER_TEMP/tree.tar.xz" \
            packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

  # AUR recipe: PKGBUILD + .SRCINFO for database-manager-bin, rendered with this
  # build's checksums and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: debs
          merge-multiple: true

      # A release run renders the download URLs with the release's own tag.
      - name: Render and check the PKGBUILD
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "debs/database-manager_${VERSION}_amd64.deb" "debs/database-manager_${VERSION}_arm64.deb" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Builds the Flatpak from the same tree, installs the bundle and runs it in
  # the sandbox: ldd of every ELF file against the GNOME runtime, the
  # bundled liblmdb.so.0 loaded by name as the LMDB driver does, and the app
  # under Xvfb until its window is up and Dart has created the data folder.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      APP_ID: com.dhivalabs.database_manager
    steps:
      - uses: actions/checkout@v7

      # A workspace path: inside a container job, runner.temp names the
      # host's directory, not the container's $RUNNER_TEMP.
      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: flatpak-tree

      # The metainfo's newest <release> must be this version, or software
      # centres show a stale one.
      - name: Unpack the installed tree
        id: v
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          grep -F "<release version=\"$VERSION\"" "packaging/flatpak/$APP_ID.metainfo.xml" ||
            { echo "::error::add <release version=\"$VERSION\" .../> to packaging/flatpak/$APP_ID.metainfo.xml"; exit 1; }
          mkdir -p packaging/flatpak/tree
          tar -xJf flatpak-tree/tree.tar.xz -C packaging/flatpak/tree
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          bundle: database-manager-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
          artifact-name: flatpak-${{ matrix.arch }}
          arch: ${{ matrix.fp_arch }}
          cache: false

      - name: Install the bundle and run it
        timeout-minutes: 10
        env:
          BUNDLE: database-manager-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
        run: |
          flatpak install -y --noninteractive --bundle "$BUNDLE"
          flatpak info "$APP_ID"
          flatpak info --show-permissions "$APP_ID"

          # Every ELF file in /app must find all of its libraries in the
          # runtime or next to it.
          flatpak run --command=bash "$APP_ID" -c '
            set -euo pipefail
            mapfile -d "" elfs < <(find /app -type f -print0)
            n=0; bad=0
            for f in "${elfs[@]}"; do
              [ "$(head -c 4 "$f" | od -An -tx1 | tr -d " \n")" = 7f454c46 ] || continue
              n=$((n + 1))
              if LD_LIBRARY_PATH=/app/lib/database-manager/lib ldd "$f" | grep "not found"; then
                echo "missing libraries for $f"; bad=1
              fi
            done
            echo "$n ELF files checked with ldd"
            [ "$bad" = 0 ] && [ "$n" -ge 5 ]
          '

          # LMDB: the driver dlopens liblmdb.so.0 by name.
          flatpak run --command=python3 "$APP_ID" -c \
            'import ctypes; print(ctypes.CDLL("liblmdb.so.0"))'

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOS'
          log="$RUNNER_TEMP/flatpak-smoke.log"
          flatpak run "$APP_ID" > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            kill -0 "$pid" 2> /dev/null || { echo "the app exited early"; cat "$log"; exit 1; }
            if python3 packaging/flatpak/x11_window.py 'Database Manager' &&
               [ -d "$HOME/.var/app/$APP_ID/data/com.dhivalabs.database_manager" ] && [ "$i" -ge 20 ]; then
              echo "still running after ${i}s; data folder:"
              ls -la "$HOME/.var/app/$APP_ID/data/com.dhivalabs.database_manager"
              kill "$pid"
              cat "$log"
              if grep -E 'error while loading shared libraries|cannot open shared object|undefined symbol' "$log"; then exit 1; fi
              exit 0
            fi
            sleep 1
          done
          echo "no Database Manager window and data folder after 90s"
          find "$HOME/.var/app" -maxdepth 4
          cat "$log"
          exit 1
          EOS
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

  release:
    name: Release assets
    needs: [linux, windows, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      # Named patterns, not every artifact: the tree-* ones are build input.
      - uses: actions/download-artifact@v8
        with:
          pattern: 'linux-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'windows-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'distros-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'flatpak-*'
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          FILES=""
          for arch in amd64 arm64; do FILES="$FILES assets/database-manager_${VERSION}_${arch}.deb"; done
          for arch in x64 arm64; do FILES="$FILES assets/DatabaseManager-${VERSION}-windows-${arch}.zip"; done
          for m in x86_64 aarch64; do
            FILES="$FILES assets/database-manager-${VERSION}-1.${m}.rpm assets/database-manager-${VERSION}-1-${m}.pkg.tar.zst"
            FILES="$FILES assets/DatabaseManager-${VERSION}-${m}.AppImage assets/database-manager-${VERSION}-${m}.flatpak"
          done
          FILES="$FILES assets/database-manager-bin-${VERSION}-aur.tar.gz"
          ls -l assets
          ls -l $FILES
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # Names already on the release (for example the hand-built amd64 .deb)
      # are kept as they are.
      - name: Upload to release ${{ github.event.release.tag_name || inputs.release_tag }}
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in $FILES; do
            name="$(basename "$f")"
            if grep -qxF "$name" <<< "$existing"; then
              echo "skip $name (already on release $TAG)"
            else
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
