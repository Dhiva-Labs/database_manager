# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (packaging/make_deb.sh).

NAME=database-manager        # package name, the same as the .deb's
APP_NAME=DatabaseManager     # AppImage file name, as the Windows zip's
GITHUB_REPO=Dhiva-Labs/database_manager
TAG_PREFIX=v                 # release runs pass their own tag (RELEASE_TAG)
SUMMARY='Multi-engine desktop database manager'
DESCRIPTION='Database Manager is a desktop client to open, browse, query, edit, export (CSV) and back up databases across five engines from one UI: SQLite (incl. SQLCipher-encrypted files), MySQL/MariaDB, PostgreSQL, MongoDB and LMDB. It offers a plain-English row finder for non-technical users plus a raw SQL / command editor for developers, password-protected database support, and one-click backups.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/database_manager
# The repository does not state a licence yet, so the packages make no
# assertion (SPDX NOASSERTION). Set the real one here once there is one.
LICENSE=NOASSERTION
LICENSE_FILE=''

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# when the build machine has a JDK, as the CI runners do, and it links that
# machine's libjvm.so by absolute path. Nothing loads it on desktop Linux,
# and shipping it would make the rpm require a JVM.
EXCLUDE=(usr/lib/database-manager/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. The
# Flutter engine also dlopens EGL and GLES 2 (libepoxy), which no ELF file
# lists, and aborts without them, so they are named here as rpm soname
# capabilities.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
# The LMDB driver dlopens liblmdb.so or liblmdb.so.0 (the .deb recommends
# liblmdb0). Fedora's and openSUSE's runtime packages only have a
# versioned name (liblmdb.so.0.0.0, liblmdb-0.9.x.so); lmdb-devel, the same
# name on both, adds liblmdb.so.
RPM_RECOMMENDS=(lmdb-devel)
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest;
# libglvnd is the dlopened EGL/GLES 2. Arch has no weak dependencies, and
# lmdb (with liblmdb.so) is small, so it is a plain one.
ARCH_DEPENDS=(gtk3 libglvnd lmdb)
ARCH_INDEPENDENT=0

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/database-manager/database_manager
DESKTOP=usr/share/applications/database-manager.desktop
ICON=usr/share/icons/hicolor/256x256/apps/database-manager.png
APPRUN_ENV=''                # /usr/bin/database-manager is a plain link
# What the AppImage and the Flatpak carry, copied from the build machine
# (see pack.sh): Ubuntu's liblmdb.so.0, the name the LMDB driver loads, which
# neither most desktops nor the GNOME runtime have.
BUNDLE_LIBS=(liblmdb.so.0)
# Host libraries the AppImage relies on besides GTK 3 (Fedora names,
# installed for the AppImage check): EGL and GLES 2, which every desktop
# has but a minimal container does not.
APPIMAGE_HOST_PKGS='libglvnd-egl libglvnd-gles'

# Smoke tests run in each distribution container by verify.sh.
GUI_CMD=database-manager     # must still be running after SMOKE_SECONDS under Xvfb
SMOKE_SECONDS=20
# The same proof as the .deb smoke run: the window is only mapped after
# Flutter's first frame, and the connection list creates the
# application-support folder from Dart (a `find -path` pattern under $HOME).
SMOKE_WINDOW='Database Manager'
SMOKE_DATA_PATH='.local/share/com.dhivalabs.database_manager'
SMOKE_CMD=''
# LMDB: with the weak dependencies installed (rpm) or the plain one (Arch),
# the dynamic linker finds a liblmdb.so or liblmdb.so.0, as the driver asks:
# in its cache, or in /usr/lib64, which it searches after the cache.
# openSUSE's liblmdb runs ldconfig before lmdb-devel adds liblmdb.so, so
# there the link is only in the cache after the next ldconfig run.
EXTRA_CHECK="ldconfig -p | grep -E '^[[:space:]]+liblmdb\\.so(\\.0)? ' || ls -lL /usr/lib64/liblmdb.so"
