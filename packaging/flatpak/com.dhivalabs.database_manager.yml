# Flatpak manifest for Database Manager.
#
# Like the .rpm, Arch package and AppImage, this repackages the installed
# tree of the .deb that CI builds (unpacked into packaging/flatpak/tree/ by
# the workflow), so the Flatpak ships the same binary as every other format
# instead of a second build inside the sandbox. A Flathub submission needs
# `tree` swapped for an archive source (release URL + sha256); see README.md
# in this directory.
id: com.dhivalabs.database_manager
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: database-manager
finish-args:
  # GTK needs a display socket; fallback-x11 covers X11-only desktops.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU acceleration for Flutter's renderer.
  - --device=dri
  # MySQL/MariaDB, PostgreSQL and MongoDB servers, local or remote.
  - --share=network
  # SQLite writes its journal next to the database file and LMDB opens a
  # whole environment directory, neither of which the file chooser portal
  # grants; saved connections and backup folders are reopened by path.
  - --filesystem=home
modules:
  - name: database-manager
    buildsystem: simple
    sources:
      - type: dir
        path: tree
        dest: tree
      - type: file
        path: com.dhivalabs.database_manager.metainfo.xml
    build-commands:
      # Flutter finds lib/ and data/ next to its executable.
      - install -d /app/lib /app/bin
      - cp -a tree/usr/lib/database-manager /app/lib/database-manager
      - ln -s ../lib/database-manager/database_manager /app/bin/database-manager
      # The runtime has no liblmdb, so the tree carries the build machine's
      # liblmdb.so.0 (packaging/linux-distros/distro.conf, BUNDLE_LIBS);
      # /app/lib is on the sandbox's library path.
      - install -m644 /app/lib/database-manager/bundled/lib/* /app/lib/
      - rm -r /app/lib/database-manager/bundled
      - install -Dm644 tree/usr/share/applications/database-manager.desktop /app/share/applications/com.dhivalabs.database_manager.desktop
      - desktop-file-edit --set-icon=com.dhivalabs.database_manager /app/share/applications/com.dhivalabs.database_manager.desktop
      - for s in 64 128 256; do install -Dm644 tree/usr/share/icons/hicolor/${s}x${s}/apps/database-manager.png /app/share/icons/hicolor/${s}x${s}/apps/com.dhivalabs.database_manager.png; done
      - install -Dm644 com.dhivalabs.database_manager.metainfo.xml /app/share/metainfo/com.dhivalabs.database_manager.metainfo.xml
